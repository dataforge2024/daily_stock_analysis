# GitHub Actions 智能选股工作流配置

name: 每日股票推荐(中证500)

# 触发条件
on:
  # 定时触发（周二、四早上7点运行，北京时间）
  schedule:
    # 周二、四 早上 7:00 运行（北京时间，UTC+8）
    # Cron 格式：分 时 日 月 周
    # 注意：GitHub Actions 使用 UTC 时间，需要减 8 小时
    # 北京时间周二、四 7:00 = UTC 周一、三 23:00
    - cron: '0 23 * * 1,3'  # UTC 周一、三 23:00 = 北京时间 周二、四 7:00
  
  # 手动触发
  workflow_dispatch:
    inputs:
      stock_pool:
        description: '股票池选择'
        required: true
        default: 'zz500'
        type: choice
        options:
          - hs300      # 沪深300
          - zz500      # 中证500
          - all        # 全市场
      
      top_n:
        description: '推荐股票数量'
        required: true
        default: '10'
        type: choice
        options:
          - '3'
          - '5'
          - '10'
          - '15'
          - '20'

# 环境变量
env:
  PYTHON_VERSION: '3.12'
  TZ: 'Asia/Shanghai'  # 设置时区为北京时间

# 作业定义
jobs:
  # Job 1: 数据获取阶段
  fetch-data:
    name: 获取股票数据
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 数据获取阶段设置120分钟超时
    
    steps:
      # 1. 检出代码
      - name: 📥 检出代码
        uses: actions/checkout@v4
      
      # 2. 设置 Python 环境
      - name: 🐍 设置 Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      # 3. 安装系统依赖
      - name: 📦 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev
      
      # 4. 安装 Python 依赖
      - name: 📦 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # 5. 配置环境变量（数据获取阶段）
      - name: ⚙️ 配置环境
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          STOCK_POOL_INPUT: ${{ github.event.inputs.stock_pool || 'zz500' }}
        run: |
          case "${STOCK_POOL_INPUT}" in
            hs300)
              STOCK_POOLS="沪深300"
              ;;
            zz500)
              STOCK_POOLS="中证500"
              ;;
            all)
              STOCK_POOLS="沪深300,中证500"
              ;;
            *)
              STOCK_POOLS="沪深300"
              ;;
          esac
          
          cat > .env << EOF
          # 数据源配置
          TUSHARE_TOKEN=${TUSHARE_TOKEN}
          
          # 股票池配置
          STOCK_POOLS=${STOCK_POOLS}
          RECOMMEND_ENABLED=true
          RECOMMEND_TOP_N=100
          
          # 关闭自选股分析
          STOCK_LIST=
          
          # 仅获取数据，不进行AI分析
          FETCH_ONLY=true
          
          # 日志配置
          LOG_LEVEL=INFO
          
          # 运行环境
          ENVIRONMENT=production
          GITHUB_ACTIONS=true
          EOF
          
          echo "✅ 环境配置完成（数据获取模式）"
          echo "📊 股票池: ${STOCK_POOLS}"
      
      # 6. 运行数据获取
      - name: 📊 获取股票数据
        run: |
          mkdir -p data logs reports
          echo "========================================="
          echo "开始获取股票数据"
          echo "时间: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')"
          echo "========================================="
          
          python3 main.py --fetch-only
          
          echo "========================================="
          echo "✅ 数据获取完成"
          echo "========================================="
      
      # 7. 上传数据到 artifacts
      - name: 📤 上传数据
        uses: actions/upload-artifact@v4
        with:
          name: stock-data
          path: |
            data/
          retention-days: 1
  
  # Job 2: AI分析阶段
  analyze-stocks:
    name: AI智能分析
    runs-on: ubuntu-latest
    needs: fetch-data  # 依赖数据获取阶段
    timeout-minutes: 50  # AI分析阶段设置50分钟超时
    
    steps:
      # 1. 检出代码
      - name: 📥 检出代码
        uses: actions/checkout@v4
      
      # 2. 设置 Python 环境
      - name: 🐍 设置 Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      # 3. 安装系统依赖
      - name: 📦 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev
      
      # 4. 安装 Python 依赖
      - name: 📦 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # 5. 下载数据 artifacts
      - name: 📥 下载股票数据
        uses: actions/download-artifact@v4
        with:
          name: stock-data
          path: data/
      
      # 6. 配置环境变量（AI分析阶段）
      - name: ⚙️ 配置环境
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || secrets.GEMINI_MODEL || 'gemini-3-flash-preview' }}
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
          BOCHA_API_KEYS: ${{ secrets.BOCHA_API_KEYS }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
          STOCK_POOL_INPUT: ${{ github.event.inputs.stock_pool || 'zz500' }}
          TOP_N_INPUT: ${{ github.event.inputs.top_n || '10' }}
        run: |
          case "${STOCK_POOL_INPUT}" in
            hs300)
              STOCK_POOLS="沪深300"
              ;;
            zz500)
              STOCK_POOLS="中证500"
              ;;
            all)
              STOCK_POOLS="沪深300,中证500"
              ;;
            *)
              STOCK_POOLS="沪深300"
              ;;
          esac
          
          cat > .env << EOF
          # AI API Keys
          GEMINI_API_KEY=${GEMINI_API_KEY}
          GEMINI_MODEL=${GEMINI_MODEL}
          TAVILY_API_KEYS=${TAVILY_API_KEYS}
          BOCHA_API_KEYS=${BOCHA_API_KEYS}
          
          # 股票池配置
          STOCK_POOLS=${STOCK_POOLS}
          RECOMMEND_ENABLED=true
          RECOMMEND_TOP_N=${TOP_N_INPUT}
          
          # 关闭自选股分析
          STOCK_LIST=
          
          # 仅分析已获取的数据
          ANALYZE_ONLY=true
          
          # 通知配置
          FEISHU_WEBHOOK_URL=${FEISHU_WEBHOOK_URL}
          WECHAT_WEBHOOK_URL=${WECHAT_WEBHOOK_URL}
          
          # 日志配置
          LOG_LEVEL=INFO
          
          # 运行环境
          ENVIRONMENT=production
          GITHUB_ACTIONS=true
          EOF
          
          echo "✅ 环境配置完成（AI分析模式）"
          echo "📊 股票池: ${STOCK_POOLS}"
          echo "🔢 推荐数量: ${TOP_N_INPUT}"
      
      # 7. 运行 AI 分析
      - name: 🤖 运行 AI 分析
        run: |
          mkdir -p logs reports
          echo "========================================="
          echo "开始运行AI智能分析"
          echo "时间: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')"
          echo "========================================="
          
          python3 main.py --analyze-only
          
          echo "========================================="
          echo "✅ AI分析完成"
          echo "=========================================" 
      
      # 7. 上传结果
      - name: 📤 上传选股结果
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stock-selection-results-${{ github.run_number }}
          path: |
            reports/
            logs/
          retention-days: 30  # 保留 30 天
      
      # 8. 显示结果摘要
      - name: 📊 显示结果摘要
        if: always()
        run: |
          echo "========================================="
          echo "任务执行完成"
          echo "========================================="
          if [ -d "reports" ]; then
            echo "生成的报告:"
            ls -lh reports/
          fi
          if [ -d "logs" ]; then
            echo ""
            echo "日志文件:"
            ls -lh logs/
          fi

# 工作流程权限
permissions:
  contents: read
  actions: write
